# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  dev:
    desc: Start API + frontend dev servers in parallel
    deps: [dev:api, dev:web]

  dev:api:
    desc: Start API dev server
    dir: api
    cmds:
      - dotnet run --project Api/Api.csproj

  dev:web:
    desc: Start frontend dev server
    dir: web
    cmds:
      - npm run dev

  build:
    desc: Builds API + frontend (parallel)
    deps: [build:api, build:web]

  build:api:
    dir: api
    cmds:
      - dotnet build Api/Api.csproj --configuration Release

  build:web:
    dir: web
    cmds:
      - npm run build

  test:
    desc: Runs API + frontend tests (parallel)
    deps: [test:api, test:web]

  test:api:
    dir: api
    cmds:
      - dotnet test Api.Tests/Api.Tests.csproj --configuration Release --collect "XPlat Code Coverage"

  test:web:
    dir: web
    cmds:
      - npm run test:coverage

  lint:
    desc: Check formatting and lint frontend
    dir: web
    cmds:
      - npm run format:check
      - npm run lint

  typecheck:web:
    desc: Typecheck frontend
    dir: web
    cmds:
      - npm run typecheck

  ci:
    desc: "Sequential: lint -> typecheck:web -> build -> test"
    cmds:
      - task: lint
      - task: typecheck:web
      - task: build
      - task: test

  docker:
    desc: Spins up API + frontend via Docker Compose
    cmds:
      - docker compose up --build
